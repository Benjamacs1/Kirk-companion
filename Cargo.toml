[package]
name = "kirk-companion"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Native, open-source desktop bridge for launching Minecraft from the Kirk dashboard"
license = "MIT"
repository = "https://github.com/Benjamacs1/Kirk-companion"
default-run = "kirk-companion"

[dependencies]
anyhow = "1"
auto-launch = "0.6"
base64 = "0.22"
directories = "6"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
futures-util = { version = "0.3", features = ["sink"] }
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1

[[bin]]
name = "kirk-companion"
path = "src/main.rs"
