name: Companion checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run test:ui
        if: runner.os == 'Windows'
      - run: npm run dist
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: kirk-companion-windows
          path: |
            dist/*.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
